name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    defaults:
      run:
        working-directory: dsh-math-calculator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dsh-math-calculator/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建（主 + 客户端）
        run: npm run build

      - name: 全量测试
        run: npm run test:all

      - name: 注释覆盖
        run: npm run doccheck

      - name: 装机自检
        run: npm run preflight
